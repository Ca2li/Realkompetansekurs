<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Om Meg - med layout</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: gray;
        }
        
        .rad {
            display: flex;
            justify-content: space-evenly;
        }

        .kort {
            background-color: white;
            margin: 50px;
            padding: 20px;
            border-radius: 30px;
            outline-color: blue;
            outline-style: solid;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: blue; background-color: white;">Om Meg</h1>
    <div class="rad">
        <div class="kort">
            <h2>Cato Lindanger</h2>
            <div>Jeg er 26 år gammel, kommer fra Stavanger og bor på Rennesøy.</div>
        </div>
        <div class="kort">
            <h2>Mine Hobbyer</h2>
            <ul>
                <li>Skyting</li>
                <li>Gaming</li>
                <li>Kjøring</li>    
            </ul>
        </div>
        <div class="kort">
            <h2>Mine Favorittspill</h2>
            <ol>
                <li>The Binding of Isaac</li>
                <li>Hunt: Showdown 1896</li>
                <li>Dead by Daylight</li>
            </ol>
        </div>
    </div>
    
</body>
</html>
