<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Tilordningsoperatorer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        background: #f0f4f8;
        text-align: center;
      }
      h1 {
        font-size: 80px;
        color: #005f99;
        margin: 0;
      }
      button {
        font-size: 20px;
        padding: 12px 28px;
        margin: 8px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <h1 id="teller">0</h1>

    <!-- OPPGAVE 1 av 2: Tilordningsoperatorer -->

    <!-- Lag tre knapper:
         "+5"       → øker telleren med 5
         "-3"       → minker telleren med 3
         "Doble"    → ganger telleren med 2
         "Nullstill" → setter telleren til 0 -->

    <button onclick='økMed5()'>+5</button>
    <button onclick='minkMed3()'>-3</button>
    <button onclick='doble()'>Doble</button>
    <button onclick='nullstill()'>Nullstill</button>

    <script>
      let antall = 0;

      // Lag en funksjon oppdater() som viser antall i #teller
      
      function oppdater() {
        document.getElementById("teller").innerHTML = antall;
      }
      
      // Lag fire funksjoner: okMed5(), minkMed3(), doble(), nullstill()
      // Bruk tilordningsoperatorer: +=  -=  *=
      // Alle funksjonene skal kalle oppdater() til slutt
      
      function økMed5() {
        antall += 5;
        oppdater();
      }

      function minkMed3() {
        antall -= 3;
        oppdater();
      }

      function doble() {
        antall *= 2;
        oppdater();
      }

      function nullstill() {
        antall = 0;
        oppdater();
      }
    </script>
  </body>
</html>
