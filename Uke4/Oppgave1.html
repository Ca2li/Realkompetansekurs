<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Stemmeteller – MVC</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        background: #f0f4f8;
        max-width: 500px;
      }

      /* Lag CSS som gjør siden presentabel.
           Du trenger minst:
           - stil på knappene
           - stil på #status-meldingen
           - stil på stemme-visningen */

      button {
        cursor: pointer;
        font-size: 20px;
        padding: 5px;
        margin: 5px;
        background-color: #ffe4c4;
        border-radius: 6px;
      }

      #status {
        font-size: 30px;
        margin: 1rem;
      }

      .stemmer {
        margin: 1rem;
        padding: 1rem;
        background-color: #daac70;
        width: max-content;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Stemmeteller</h1>
    <p>En enkel app der du kan stemme for eller mot et forslag.</p>

    <!-- Legg til to knapper: "For" og "Mot" -->
    <!-- Og en "Nullstill"-knapp -->

    <button onclick="stemmFor()">For</button>
    <button onclick="stemmMot()">Mot</button>
    <button onclick="nullstill()">Nullstill</button>

    <!-- Lag et element som viser: "For: X | Mot: Y" -->
    <!-- Lag et element som viser en statusmelding, f.eks. "Det er flertall for!" -->

    <h2 class="stemmer">For: <span id="for"></span> | Mot: <span id="mot"></span></h2>
    <h2 id="status"></h2>

    <script>
      // OPPGAVE: Bygg stemmetelleren i MVC-stil

      // ---- MODEL ----
      // Lag to variabler: stemmerFor og stemmerMot
      // Begge starter på 0

      let stemmerFor = 0
      let stemmerMot = 0
      let statusMelding = ""

      // ---- VIEW ----
      // Lag en funksjon updateView() som:
      // 1. Oppdaterer visningen med antall stemmer for og mot
      // 2. Viser en statusmelding:
      //    - "Det er flertall for!" hvis stemmerFor > stemmerMot
      //    - "Det er flertall mot!" hvis stemmerMot > stemmerFor
      //    - "Det er uavgjort!" hvis de er like
      // updateView() skal ALDRI endre model — bare lese fra den

      function updateView() {
        document.getElementById("for").innerHTML = stemmerFor
        document.getElementById("mot").innerHTML = stemmerMot
        document.getElementById("status").innerHTML = statusMelding
        console.log(stemmerFor, stemmerMot)
        console.log(statusMelding)
      }

      // ---- CONTROLLER ----
      // Lag tre funksjoner: stemmFor(), stemmMot(), nullstill()
      // Hver funksjon skal:
      // 1. Oppdatere riktig modellvariabel
      // 2. Kalle updateView()
      // Controller-funksjoner skal ALDRI endre HTML direkte

      function stemmFor() {
          stemmerFor++;
        if (stemmerFor == stemmerMot){
            statusMelding = "Det er Uavgjort!"
        } else if (stemmerMot > stemmerFor) {
            statusMelding = "Det er flertall Mot!"
        } else if (stemmerMot < stemmerFor) {
            statusMelding = "Det er flertall For!"
        }
        updateView()
      }

      function stemmMot() {
          stemmerMot++;
          if (stemmerFor == stemmerMot){
              statusMelding = "Det er Uavgjort!"
            } else if (stemmerMot > stemmerFor) {
                statusMelding = "Det er flertall Mot!"
            } else if (stemmerMot < stemmerFor) {
                statusMelding = "Det er flertall For!"
            }
        updateView()
      }

      function nullstill() {
        stemmerFor = 0;
        stemmerMot = 0;
        updateView()
      }

      // Kall updateView() én gang nederst slik at siden vises korrekt ved oppstart

      updateView()
    </script>
  </body>
</html>
