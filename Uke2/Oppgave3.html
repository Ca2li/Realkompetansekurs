<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Kortgenerator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        background: #5b80a5;
      }

      /* Lag CSS for .kort slik at hvert kort:
           - har hvit bakgrunn
           - har runde hjørner
           - har litt padding
           - har litt margin-bottom
           - ser presentabelt ut */
      .kort {
        background-color: white;
        border: black, solid, 2px;
        border-radius: 2rem;
        padding: 2%;
        margin-bottom: 2rem;
        max-width: 400px;
        min-height: 200px;
      }

      /* Valgfritt: style overskriften og teksten inni kortene */

      #output {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Teknologier jeg har lært</h1>
    <div id="output"></div>

    <script>
      // OPPGAVE: Kortgenerator med funksjoner og parametre

      // STEG 1:
      // Lag en funksjon som heter lagKort(tittel, tekst)
      // Funksjonen skal bruke document.getElementById("output").innerHTML
      // til å vise et kort med tittelen og teksten
      // Kortet skal ha class="kort"

      let htmlHeadline = "HTML"
      let htmlText = "I HTML har jeg lært om tagger, klasser, id-er osv. og hvordan disse blir brukt til å bygge en nettside."

      let cssHeadline = "CSS"
      let cssText = "I CSS har jeg lært å bruke style til å forandre utseende på mye forskjellig man lager i HTML."

      let jsHeadline = "JavaScript"
      let jsText = "I JavaScript har jeg lært å bruke funksjoner og variabler osv. til å automatisere eller å kjøre kode."

      function lagKort(tittel, tekst, farge) {
        document.getElementById("output").innerHTML += /*HTML*/ `
          <div class="kort">
          <h1 style="background-color:${farge};">${tittel}</h1>
          <p>${tekst}</p>
          </div>`
      }

      lagKort(htmlHeadline, htmlText, 'limegreen')
      lagKort(cssHeadline, cssText, 'aqua')
      lagKort(jsHeadline, jsText, 'orange')
      // STEG 2:
      // Kall lagKort() tre ganger med ulike titler og tekster:
      // - "HTML" og en beskrivelse
      // - "CSS" og en beskrivelse
      // - "JavaScript" og en beskrivelse
      // Problemet: hvert kall overskriver det forrige. Hvorfor?

      // STEG 3:
      // Endre funksjonen slik at den LEGGER TIL et kort
      // i stedet for å erstatte alt
      // Tips: innerHTML += i stedet for innerHTML =

      // STEG 4 (bonus):
      // Legg til en tredje parameter: farge
      // lagKort(tittel, tekst, farge)
      // Bruk fargen som bakgrunnsfarge på kortets overskrift
    </script>
  </body>
</html>
