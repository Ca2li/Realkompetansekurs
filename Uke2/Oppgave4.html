<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>If-setning</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        background: #f0f4f8;
      }
      input,
      button {
        font-size: 18px;
        padding: 10px 16px;
        margin: 6px;
      }
      #svar {
        font-size: 24px;
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Hva slags billett?</h1>
    <p>
      Skriv inn alderen til en person og få vite hvilken billett de skal ha.
    </p>

    <!-- Lag et inputfelt for alder og en knapp som kaller sjekkBillett() -->
    <input id="alder" type="number" placeholder="0"/>
    <button onclick="sjekkBillett()">Sjekk</button>
    <p id="svar"></p>

    <script>
      // Lag funksjonen sjekkBillett()
      // Den skal lese alderen fra inputfeltet og vise riktig billettype i #svar:

      const svar = document.getElementById("svar");

      function sjekkBillett() {
        let alder = document.getElementById("alder").value;
        if (alder >= 0 && alder <= 6) {
            svar.innerHTML = "Gratis";
        } else if (alder > 6 && alder <= 17) {
            svar.innerHTML = "Barnebillett";
        } else if (alder > 17 && alder <= 66) {
            svar.innerHTML = "Voksenbillett";
        } else if (alder >= 67) {
            svar.innerHTML = "Pensjonistbillett";
        } else {
            svar.innerHTML = "error";
        }
      }

      // Under 6 år    → "Gratis"
      // 6–17 år       → "Barnebillett"
      // 18–66 år      → "Voksenbillett"
      // 67 år eller mer → "Pensjonistbillett"

      // Tips: bruk if / else if / else
    </script>
  </body>
</html>
